[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heylandcircle"
version = "0.1.0"
description = "Open-source Python package for Heyland circle diagram analysis."
readme = "README.md"
requires-python = ">=3.10"

license = { text = "MIT" }

authors = [
    { name = "Anubhav Gupta" },
    { name = "Abhinav Gupta" }
]

dependencies = [
    "numpy",
    "matplotlib",
]

keywords = [
    "induction-machines",
    "electrical-engineering",
    "circle-diagram",
    "scientific-computing",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]